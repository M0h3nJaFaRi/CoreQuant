---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: service-consumer-secrets
  namespace: service
spec:
  encryptedData:
    # =========================
    # Encryption
    # =========================
    Framework__Encryption__AES__IV: ""
    Framework__Encryption__AES__Key: ""
    Framework__Encryption__RSA__PrivateKey: ""
  template:
    metadata:
      annotations:
        helm.sh/resource-policy: keep
      name: service-consumer-secrets
      namespace: service
    type: Opaque
