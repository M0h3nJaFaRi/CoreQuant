---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: service-api-secrets
  namespace: service
spec:
  encryptedData:
    # =========================
    # Encryption
    # =========================
    Framework__Encryption__AES__IV: ""
    Framework__Encryption__AES__Key: ""
    Framework__Encryption__RSA__PrivateKey: ""
    # =========================
    # Databases
    # =========================
    Infrastructure__Databases__Core__Username: ""
    Infrastructure__Databases__Core__Password: ""
    Infrastructure__Databases__News__Username: ""
    Infrastructure__Databases__News__Password: ""
    Infrastructure__Databases__Forex__Username: ""
    Infrastructure__Databases__Forex__Password: ""
    Infrastructure__Databases__Index__Username: ""
    Infrastructure__Databases__Index__Password: ""
    Infrastructure__Databases__Metal__Username: ""
    Infrastructure__Databases__Metal__Password: ""
    Infrastructure__Databases__Stock__Username: ""
    Infrastructure__Databases__Stock__Password: ""
    Infrastructure__Databases__Crypto__Username: ""
    Infrastructure__Databases__Crypto__Password: ""
    Infrastructure__Databases__Commodity__Username: ""
    Infrastructure__Databases__Commodity__Password: ""
    # =========================
    # Redis
    # =========================
    Infrastructure__Redis__Password: ""
  template:
    metadata:
      annotations:
        helm.sh/resource-policy: keep
      name: service-api-secrets
      namespace: service
    type: Opaque
