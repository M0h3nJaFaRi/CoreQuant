---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: service-worker-secrets
  namespace: service
spec:
  encryptedData:
    # =========================
    # Encryption
    # =========================
    Framework__Encryption__AES__IV: ""
    Framework__Encryption__AES__Key: ""
    Framework__Encryption__RSA__PrivateKey: ""
    # =========================
    # Databases
    # =========================
    Infrastructure__Databases__Write__Username: ""
    Infrastructure__Databases__Write__Password: ""
    Infrastructure__Databases__Read__Username: ""
    Infrastructure__Databases__Read__Password: ""
    # =========================
    # Redis
    # =========================
    Infrastructure__Redis__Password: ""
  template:
    metadata:
      annotations:
        helm.sh/resource-policy: keep
      name: service-worker-secrets
      namespace: service
    type: Opaque
