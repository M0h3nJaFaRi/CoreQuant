apiVersion: v1
kind: ConfigMap
metadata:
  name: service-scheduler-properties
  namespace: service
data:
  # =========================
  # Host
  # =========================
  DOTNET_ENVIRONMENT: "Staging"
  ApplicationName: "CoreQuant.Scheduler"

  # =========================
  # Serilog
  # =========================
  Framework__Serilog__MinimumLevel__Default: "Information"
  Framework__Serilog__MinimumLevel__Override__Microsoft_Hosting_Lifetime: "Information"
  Framework__Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime: "Information"
  Framework__Serilog__MinimumLevel__Override__Microsoft_EntityFrameworkCore: "Warning"
  Framework__Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore: "Warning"
  Framework__Serilog__MinimumLevel__Override__System: "Warning"
  Framework__Serilog__Console__Enabled: "false"

  # =========================
  # Syslog
  # =========================
  Framework__Syslog__Enabled: "false"
  Framework__Syslog__Address: ""
  Framework__Syslog__Port: "0"
  Framework__Syslog__Format: "RFC5424"
  Framework__Syslog__RestrictedToMinimumLevel: "Information"

  # =========================
  # Health
  # =========================
  Framework__Health__LivenessPath: "/health/live"
  Framework__Health__ReadinessPath: "/health/ready"

  # =========================
  # Metrics
  # =========================
  Framework__Metrics__Enabled: "true"
  Framework__Metrics__Path: "/metrics"

  # =========================
  # Resilience
  # =========================
  Framework__Resilience__Retry__UseJitter: "true"
  Framework__Resilience__Retry__Delay: "00:00:02"
  Framework__Resilience__Retry__MaxRetryAttempts: "3"
  Framework__Resilience__Timeout: "00:00:15"
  Framework__Resilience__CircuitBreaker__FailureThreshold: "3"
  Framework__Resilience__CircuitBreaker__BreakDuration: "00:01:00"

  # =========================
  # Encryption (non-secret)
  # =========================
  Framework__Encryption__RSA__PublicKey: ""

  # =========================
  # Databases
  # =========================
  Infrastructure__Databases__Core__Host: ""
  Infrastructure__Databases__Core__Port: "3306"
  Infrastructure__Databases__Core__Name: ""
  Infrastructure__Databases__Core__CommandTimeout: "00:00:30"

  Infrastructure__Databases__News__Host: ""
  Infrastructure__Databases__News__Port: "3306"
  Infrastructure__Databases__News__Name: ""
  Infrastructure__Databases__News__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Forex__Host: ""
  Infrastructure__Databases__Forex__Port: "3306"
  Infrastructure__Databases__Forex__Name: ""
  Infrastructure__Databases__Forex__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Index__Host: ""
  Infrastructure__Databases__Index__Port: "3306"
  Infrastructure__Databases__Index__Name: ""
  Infrastructure__Databases__Index__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Metal__Host: ""
  Infrastructure__Databases__Metal__Port: "3306"
  Infrastructure__Databases__Metal__Name: ""
  Infrastructure__Databases__Metal__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Stock__Host: ""
  Infrastructure__Databases__Stock__Port: "3306"
  Infrastructure__Databases__Stock__Name: ""
  Infrastructure__Databases__Stock__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Crypto__Host: ""
  Infrastructure__Databases__Crypto__Port: "3306"
  Infrastructure__Databases__Crypto__Name: ""
  Infrastructure__Databases__Crypto__CommandTimeout: "00:00:30"

  Infrastructure__Databases__Commodity__Host: ""
  Infrastructure__Databases__Commodity__Port: "3306"
  Infrastructure__Databases__Commodity__Name: ""
  Infrastructure__Databases__Commodity__CommandTimeout: "00:00:30"


  # =========================
  # Redis
  # =========================
  Infrastructure__Redis__Host: "127.0.0.1"
  Infrastructure__Redis__Port: "6379"
  Infrastructure__Redis__KeyPrefix: "framework"
  Infrastructure__Redis__AbortOnConnectFail: "false"
  Infrastructure__Redis__Connection__AsyncTimeout: "00:00:15"
  Infrastructure__Redis__Connection__ConnectTimeout: "00:00:05"
  Infrastructure__Redis__Connection__SyncTimeout: "00:01:00"
  Infrastructure__Redis__Connection__ConnectRetry: "3"
  Infrastructure__Redis__Connection__KeepAlive: "00:01:00"

  # =========================
  # Persistence / SlowQuery
  # =========================
  Infrastructure__Persistence__SlowQuery__WarningThreshold: "00:00:00.250"
  Infrastructure__Persistence__SlowQuery__ErrorThreshold: "00:00:00.500"
  Infrastructure__Persistence__SlowQuery__CriticalThreshold: "00:00:01"

