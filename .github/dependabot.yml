version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/**/*"
      - "/tests/**/*"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/solutionItem/deployment/docker/*/*"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"